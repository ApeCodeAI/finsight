# 示例 portfolio · 中文用户 · CNY base · 多账户/多币种
#
# ⚠ 这是完全虚构的演示数据：
#   - 账户名（"工行 / 天弘平台 / 启航证券 / 海风证券 / 演示交易所"）皆为占位
#   - 持仓的标的代码是真实的（PDD, MSFT, 1810.HK, BTC ……），但 quantity /
#     avg_cost / current_price 都是为演示而设的随机数字
#   - 任何相似只为展示 finsight 的 A 股基金 + 港股 + 美股 + 加密 多元结构
#
# 用法：
#   finsight config set base-currency CNY
#   finsight config set labels-language zh
#   finsight ledger init ~/finsight-demo
#   cp examples/seed-portfolio.zh.yaml ~/finsight-demo/accounts.yaml
#   cp examples/tickers.cn.yaml         ~/finsight-demo/tickers.yaml
#   finsight ledger restore --yes

